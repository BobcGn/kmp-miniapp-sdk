[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
# Single source for the version shared by the runtime SDK and the Gradle plugin that wires it in.
# The plugin ships this as a generated resource, so neither its source nor its tests carry the
# version as a literal.
miniapp = "0.1.0-SNAPSHOT"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# Only needed to compile the Mini App Gradle plugin against the Kotlin Multiplatform DSL; the
# consumer's build supplies the plugin at runtime.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
