name: Release 0.1.1

# Only the exact release tag starts a publication. A Maven Central artifact is immutable and the
# Gradle Plugin Portal rejects a version it already holds, so the trigger is the one ref that names
# the release commit exactly, rather than a `v*` pattern a later tag could also match.
on:
  push:
    tags:
      - "v0.1.1"
  # A manual run exists only for recovery and has to be confirmed by typing the version. Use
  # `plugin` when Maven Central already accepted the runtime and the Plugin Portal upload failed:
  # the runtime is never re-uploaded, because a published version cannot be replaced.
  # `all` publishes the runtime only if Maven Central does not already hold it, then the plugin.
  workflow_dispatch:
    inputs:
      target:
        description: "all = runtime (only if missing) then plugin; plugin = Gradle Plugin Portal only"
        required: true
        default: all
        type: choice
        options:
          - all
          - plugin
      confirmation:
        description: "Type publish-0.1.1 to confirm"
        required: true
        type: string

permissions:
  contents: read

# One publication at a time, and never cancelled midway: an interrupted upload is harder to reason
# about than a queued one.
concurrency:
  group: release-0.1.1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish runtime and Gradle plugin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: v0.1.1
      RELEASE_COMMIT: 024abd672224700a78349f9b94bab90f135f3736

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: 024abd672224700a78349f9b94bab90f135f3736
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify the release identity
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^miniapp = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)"
          test "$version" = "0.1.1"
          test "$RELEASE_TAG" = "v${version}"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$CONFIRMATION" = "publish-${version}"
          else
            test "$GITHUB_EVENT_NAME" = "push"
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
            test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          fi
          if [[ -n "${ORG_GRADLE_PROJECT_miniappLocalPublicationWithoutSigning+x}" ]]; then
            echo "::error::miniappLocalPublicationWithoutSigning must never be set in release CI"
            exit 1
          fi

      - name: Check whether the runtime is already on Maven Central
        id: central
        shell: bash
        run: |
          set -euo pipefail
          present=0
          missing=0
          for artifact in kmp-miniapp-sdk kmp-miniapp-sdk-js; do
            url="https://repo1.maven.org/maven2/io/github/bobcgn/${artifact}/0.1.1/${artifact}-0.1.1.pom"
            status="$(curl --silent --show-error --location --head --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"
            case "$status" in
              200) present=$((present + 1)) ;;
              404) missing=$((missing + 1)) ;;
              *) echo "::error::Maven Central query failed: HTTP $status"; exit 1 ;;
            esac
          done
          if (( present == 2 )); then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif (( missing == 2 )); then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Runtime publication is only partially visible; wait and do not re-upload"
            exit 1
          fi

      - name: Require the runtime for plugin-only recovery
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'plugin'
        shell: bash
        env:
          RUNTIME_PUBLISHED: ${{ steps.central.outputs.published }}
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_PUBLISHED" != "true" ]]; then
            echo "::error::Plugin-only recovery requires the runtime on Maven Central"
            exit 1
          fi

      - name: Check whether the plugin is already on the Gradle Plugin Portal
        id: portal
        shell: bash
        run: |
          set -euo pipefail
          url="https://plugins.gradle.org/m2/io/github/bobcgn/miniapp/io.github.bobcgn.miniapp.gradle.plugin/0.1.1/io.github.bobcgn.miniapp.gradle.plugin-0.1.1.pom"
          status="$(curl --silent --show-error --location --head --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Plugin Portal query failed: HTTP $status"; exit 1 ;;
          esac

      - name: Run release verification
        run: ./gradlew --no-daemon --console=plain clean check verifyMiniAppGradlePluginIntegration

      - name: Publish runtime to Maven Central
        if: (github.event_name == 'push' || inputs.target == 'all') && steps.central.outputs.published == 'false'
        run: ./gradlew --no-daemon --console=plain --no-configuration-cache :kmp-miniapp-sdk:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      - name: Confirm the runtime is visible before publishing the plugin
        if: steps.portal.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            ready=true
            for artifact in kmp-miniapp-sdk kmp-miniapp-sdk-js; do
              url="https://repo1.maven.org/maven2/io/github/bobcgn/${artifact}/0.1.1/${artifact}-0.1.1.pom"
              status="$(curl --silent --show-error --location --head --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"
              case "$status" in
                200) ;;
                404) ready=false ;;
                *) echo "::error::Runtime visibility query failed: HTTP $status"; exit 1 ;;
              esac
            done
            if [[ "$ready" == "true" ]]; then
              exit 0
            fi
            if (( attempt < 30 )); then sleep 10; fi
          done
          echo "::error::Runtime is not yet visible; wait and recover with target: plugin"
          exit 1

      - name: Validate the Gradle plugin publication
        if: steps.portal.outputs.published == 'false'
        run: ./gradlew --no-daemon --console=plain --no-configuration-cache :miniapp-gradle-plugin:publishPlugins --validate-only
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      # Runs last, and only when the steps before it succeeded: the runtime is published first, and
      # a failure here leaves a complete, immutable Maven Central release that `target: plugin`
      # can finish without touching it again.
      - name: Publish Gradle plugin to the Gradle Plugin Portal
        if: steps.portal.outputs.published == 'false'
        run: ./gradlew --no-daemon --console=plain --no-configuration-cache :miniapp-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
